<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Mini Golf</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        canvas {
            display: block;
        }

        /* UI Overlay Layer */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            color: white;
            text-shadow: 2px 2px 0 #000;
            display: none;
        }

        h1 { margin: 0; font-size: 24px; color: #f1c40f; }
        p { margin: 5px 0 0 0; font-size: 16px; }

        /* Start Menu */
        #start-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
        }

        #start-menu h1 {
            font-size: 48px;
            margin-bottom: 40px;
            text-shadow: 4px 4px 0 #27ae60;
        }

        .menu-btn {
            background: #27ae60;
            border: none;
            padding: 15px 40px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 4px 0 #219150;
        }

        .menu-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #219150;
        }

        .menu-btn:hover { background: #2ecc71; }

        .file-upload-container {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }

        .file-input {
            margin-top: 10px;
            color: #ecf0f1;
        }

        #error-msg {
            color: #e74c3c;
            margin-top: 10px;
            min-height: 20px;
            font-weight: bold;
        }

        /* Leaderboard Modal */
        #leaderboard-modal {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #ecf0f1;
            color: #2c3e50;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            display: none;
            z-index: 200;
            max-height: 85vh;
            overflow-y: auto;
            width: 90%;
            max-width: 400px;
        }

        #leaderboard-modal h2 { margin-top: 0; color: #27ae60; }

        .lb-input-group { margin: 20px 0; }
        .lb-input { padding: 10px; border-radius: 4px; border: 1px solid #bdc3c7; width: 70%; font-size: 16px; }
        
        table { width: 100%; margin-top: 15px; border-collapse: collapse; background: white; border-radius: 4px; overflow: hidden; }
        th, td { padding: 8px; border-bottom: 1px solid #bdc3c7; text-align: left; }
        th { background: #34495e; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .current-user-row { background-color: #d5f5e3 !important; font-weight: bold; }

        .btn-small {
            background: #7f8c8d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 14px;
        }
        .btn-small:hover { background: #95a5a6; }

        /* In-game Messages */
        #message-area {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 50;
        }

        #message-area.visible { opacity: 1; }

        .message-text {
            font-size: 48px;
            font-weight: bold;
            color: #fff;
            text-shadow: 3px 3px 0 #27ae60;
            background: rgba(0,0,0,0.5);
            padding: 20px 40px;
            border-radius: 10px;
        }

        #controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Start Menu -->
    <div id="start-menu">
        <h1>Retro Mini Golf</h1>
        <button class="menu-btn" onclick="startGame(null)">Play Default Course</button>
        
        <div class="file-upload-container">
            <p>Or upload a Custom Course (.json)</p>
            <input type="file" id="course-upload" class="file-input" accept=".json">
            <div id="error-msg"></div>
        </div>
    </div>

    <!-- Leaderboard / Game Over Modal -->
    <div id="leaderboard-modal">
        <h2 id="lb-title">Course Complete!</h2>
        <div id="lb-score-display" style="font-size: 18px; margin-bottom: 15px;"></div>
        
        <div id="lb-submit-section">
            <p>Enter your name to save score:</p>
            <div class="lb-input-group">
                <input type="text" id="player-name" class="lb-input" placeholder="Player Name" maxlength="15">
            </div>
            <button class="menu-btn" onclick="submitScore()" style="font-size: 18px; padding: 10px 30px;">Submit</button>
        </div>

        <div id="lb-loading" style="display:none; color: #7f8c8d;">Loading scores...</div>

        <div id="lb-table-section" style="display:none;">
            <h3>Top Scores</h3>
            <table id="scores-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Name</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody id="scores-body">
                    <!-- Rows injected here -->
                </tbody>
            </table>
            <button class="btn-small" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <!-- HUD -->
    <div id="ui-layer">
        <h1 id="course-title">Default Course</h1>
        <p>Hole: <span id="level-display">1</span> / <span id="total-levels">18</span></p>
        <p>Par: <span id="par-display">3</span></p>
        <p>Strokes: <span id="strokes-display">0</span></p>
    </div>

    <!-- Notifications -->
    <div id="message-area">
        <div id="message-text" class="message-text">Hole in One!</div>
    </div>

    <div id="controls-hint">Drag anywhere to aim and shoot</div>

    <canvas id="gameCanvas"></canvas>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, getDocs } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        // 1. Initialize Firebase
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        let currentUser = null;

        // 2. Auth Flow
        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };
        initAuth();
        
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
        });

        // 3. Expose functions to global scope for HTML buttons
        window.submitScore = async function() {
            if (!currentUser) return;
            
            const nameInput = document.getElementById('player-name');
            const name = nameInput.value.trim() || 'Anonymous';
            const courseId = window.activeCourse.id || window.activeCourse.name || "unknown_course";
            
            // UI Update
            document.getElementById('lb-submit-section').style.display = 'none';
            document.getElementById('lb-loading').style.display = 'block';

            try {
                // Save Score
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard'), {
                    courseId: courseId,
                    courseName: window.activeCourse.name,
                    playerName: name,
                    score: window.gameState.strokes, // Total strokes across all levels
                    timestamp: Date.now(),
                    userId: currentUser.uid
                });
                
                // Fetch & Display Leaderboard
                await loadLeaderboard(courseId);

            } catch (e) {
                console.error("Error saving score:", e);
                document.getElementById('lb-loading').innerText = "Error saving score.";
            }
        };

        window.loadLeaderboard = async function(courseId) {
            const tableSection = document.getElementById('lb-table-section');
            const tbody = document.getElementById('scores-body');
            const loading = document.getElementById('lb-loading');
            
            loading.style.display = 'block';
            tbody.innerHTML = ''; // Clear old

            try {
                // Fetch all scores (Rule 2: No complex queries, filter in memory)
                const querySnapshot = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard'));
                
                let scores = [];
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.courseId === courseId) {
                        scores.push(data);
                    }
                });

                // Sort by Score (Ascending - Lower is better in golf)
                scores.sort((a, b) => {
                    if (a.score === b.score) return b.timestamp - a.timestamp; // Tie breaker: newer first? Or older? Let's do newer.
                    return a.score - b.score;
                });

                // Take Top 10
                scores = scores.slice(0, 10);

                // Render
                scores.forEach((s, index) => {
                    const tr = document.createElement('tr');
                    // Highlight current user's session if needed (simple check by name/score match for now)
                    if (s.userId === currentUser.uid && s.score === window.gameState.strokes) {
                        tr.classList.add('current-user-row');
                    }
                    tr.innerHTML = `
                        <td>#${index + 1}</td>
                        <td>${escapeHtml(s.playerName)}</td>
                        <td>${s.score}</td>
                    `;
                    tbody.appendChild(tr);
                });

                loading.style.display = 'none';
                tableSection.style.display = 'block';

            } catch (e) {
                console.error("Error fetching leaderboard:", e);
                loading.innerText = "Failed to load leaderboard.";
            }
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

    </script>

    <!-- Game Logic -->
    <script>
        /**
         * DEFAULT COURSE DATA
         */
        const defaultCourseData = {
            id: "default_links_v1",
            name: "Default Links",
            levels: [
                {
                    par: 2,
                    scale: 1.0,
                    start: {x: 0.2, y: 0.5},
                    hole: {x: 0.8, y: 0.5},
                    walls: [],
                    sand: [{x: 0.4, y: 0.3, w: 0.2, h: 0.4}],
                    water: []
                },
                {
                    par: 3,
                    scale: 1.0,
                    start: {x: 0.15, y: 0.8},
                    hole: {x: 0.85, y: 0.2},
                    walls: [{x: 0.4, y: 0.4, w: 0.6, h: 0.05}],
                    sand: [],
                    water: [{x: 0.6, y: 0.6, w: 0.15, h: 0.15}]
                },
                {
                    par: 5,
                    scale: 2.0, // Large level
                    start: {x: 0.1, y: 0.9},
                    hole: {x: 0.9, y: 0.1},
                    walls: [
                        {x: 0.3, y: 0.4, w: 0.4, h: 0.05},
                        {x: 0.5, y: 0.6, w: 0.05, h: 0.3}
                    ],
                    sand: [{x: 0.7, y: 0.2, w: 0.2, h: 0.2}],
                    water: [{x: 0.4, y: 0.8, w: 0.3, h: 0.1 }]
                }
            ]
        };

        /**
         * Game Engine
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const startMenu = document.getElementById('start-menu');
        const uiLayer = document.getElementById('ui-layer');
        const controlsHint = document.getElementById('controls-hint');
        const uiStrokes = document.getElementById('strokes-display');
        const uiLevel = document.getElementById('level-display');
        const uiTotalLevels = document.getElementById('total-levels');
        const uiPar = document.getElementById('par-display');
        const uiTitle = document.getElementById('course-title');
        const messageArea = document.getElementById('message-area');
        const messageText = document.getElementById('message-text');
        const errorMsg = document.getElementById('error-msg');
        const lbModal = document.getElementById('leaderboard-modal');

        let width, height;
        let animationFrameId;
        
        // Physics constants
        const FRICTION = 0.97;
        const STOP_THRESHOLD = 0.1;
        const WALL_BOUNCE = 0.7;

        // Global for access by module script
        window.activeCourse = null;
        window.gameState = {
            isPlaying: false,
            levelIndex: 0, 
            strokes: 0,
            par: 3,
            
            // World/Camera
            levelScale: 1.0,
            worldWidth: 0,
            worldHeight: 0,
            camera: { x: 0, y: 0 },

            isDragging: false,
            dragStartX: 0, 
            dragStartY: 0, 
            dragCurrentX: 0, 
            dragCurrentY: 0, 
            
            ball: { x: 0, y: 0, vx: 0, vy: 0, radius: 8, color: '#ecf0f1', moving: false, inHole: false },
            hole: { x: 0, y: 0, radius: 12 },
            walls: [],
            water: [],
            sand: [],
            golferAngle: 0
        };

        // --- Initialization ---

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            if (window.gameState.isPlaying) {
                if(!window.gameState.ball.moving) {
                    loadLevel(window.gameState.levelIndex, true);
                }
            } else {
                drawMenuBackground();
            }
        }

        window.addEventListener('resize', resize);

        // --- File Upload Logic ---

        document.getElementById('course-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const json = JSON.parse(e.target.result);
                    if (validateCourse(json)) {
                        startGame(json);
                    } else {
                        throw new Error("Invalid course format");
                    }
                } catch (err) {
                    errorMsg.innerText = "Error: " + err.message;
                }
            };
            reader.readAsText(file);
        });

        function validateCourse(data) {
            if (!data.levels || !Array.isArray(data.levels) || data.levels.length === 0) return false;
            const lvl = data.levels[0];
            if (!lvl.start || !lvl.hole) return false;
            return true;
        }

        // --- Game Flow Control ---

        window.startGame = function(customCourseData) {
            window.activeCourse = customCourseData || defaultCourseData;
            
            startMenu.style.display = 'none';
            uiLayer.style.display = 'block';
            controlsHint.style.display = 'block';
            lbModal.style.display = 'none';
            
            uiTitle.innerText = window.activeCourse.name || "Custom Course";
            uiTotalLevels.innerText = window.activeCourse.levels.length;

            window.gameState.isPlaying = true;
            resize(); 
            loadLevel(0);
            
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function loadLevel(index, preserveBall = false) {
            if (index >= window.activeCourse.levels.length) {
                endGame();
                return;
            }

            window.gameState.levelIndex = index;
            const levelData = window.activeCourse.levels[index];
            
            // Set stats
            window.gameState.par = levelData.par || 3;
            if (!preserveBall) {
                // Keep total strokes running, only reset move state
                window.gameState.ball.moving = false;
                window.gameState.ball.vx = 0;
                window.gameState.ball.vy = 0;
                window.gameState.ball.inHole = false;
            }
            window.gameState.isDragging = false;
            
            // Camera & Scale Setup
            window.gameState.levelScale = levelData.scale || 1.0;
            window.gameState.worldWidth = width * window.gameState.levelScale;
            window.gameState.worldHeight = height * window.gameState.levelScale;
            
            updateUI();

            // Coordinate conversion helper
            const sx = (val) => val * window.gameState.worldWidth;
            const sy = (val) => val * window.gameState.worldHeight;

            // Setup Objects
            if (!preserveBall) {
                window.gameState.ball.x = sx(levelData.start.x);
                window.gameState.ball.y = sy(levelData.start.y);
                // Center camera on ball initially
                window.gameState.camera.x = window.gameState.ball.x - width/2;
                window.gameState.camera.y = window.gameState.ball.y - height/2;
            }
            window.gameState.hole.x = sx(levelData.hole.x);
            window.gameState.hole.y = sy(levelData.hole.y);

            // Clear arrays
            window.gameState.walls = [];
            window.gameState.water = [];
            window.gameState.sand = [];

            // Add standard border walls (World Borders)
            window.gameState.walls.push({x: 0, y: 0, w: window.gameState.worldWidth, h: 20}); // Top
            window.gameState.walls.push({x: 0, y: window.gameState.worldHeight - 20, w: window.gameState.worldWidth, h: 20}); // Bottom
            window.gameState.walls.push({x: 0, y: 0, w: 20, h: window.gameState.worldHeight}); // Left
            window.gameState.walls.push({x: window.gameState.worldWidth - 20, y: 0, w: 20, h: window.gameState.worldHeight}); // Right

            // Load Custom Obstacles
            if (levelData.walls) {
                levelData.walls.forEach(w => window.gameState.walls.push({x: sx(w.x), y: sy(w.y), w: sx(w.w), h: sy(w.h)}));
            }
            if (levelData.water) {
                levelData.water.forEach(w => window.gameState.water.push({x: sx(w.x), y: sy(w.y), w: sx(w.w), h: sy(w.h)}));
            }
            if (levelData.sand) {
                levelData.sand.forEach(s => window.gameState.sand.push({x: sx(s.x), y: sy(s.y), w: sx(s.w), h: sy(s.h)}));
            }
        }

        function endGame() {
            window.gameState.isPlaying = false;
            
            // Show Leaderboard Modal
            lbModal.style.display = 'block';
            document.getElementById('lb-score-display').innerText = `Total Strokes: ${window.gameState.strokes}`;
            document.getElementById('lb-submit-section').style.display = 'block';
            document.getElementById('lb-table-section').style.display = 'none';
            document.getElementById('lb-loading').style.display = 'none';
        }

        // --- Inputs (Screen to World Conversion) ---

        function getPointerPos(e) {
            let cx, cy;
            if (e.touches) {
                cx = e.touches[0].clientX;
                cy = e.touches[0].clientY;
            } else {
                cx = e.clientX;
                cy = e.clientY;
            }
            // Convert to World Coordinates
            return { 
                x: cx + window.gameState.camera.x, 
                y: cy + window.gameState.camera.y 
            };
        }

        function handleStart(e) {
            if (!window.gameState.isPlaying || window.gameState.ball.moving || window.gameState.ball.inHole) return;
            const pos = getPointerPos(e);
            
            window.gameState.isDragging = true;
            window.gameState.dragStartX = window.gameState.ball.x; 
            window.gameState.dragStartY = window.gameState.ball.y;
            window.gameState.dragCurrentX = pos.x;
            window.gameState.dragCurrentY = pos.y;
            
            updateGolferAngle(pos.x, pos.y);
        }

        function handleMove(e) {
            if (!window.gameState.isDragging) return;
            const pos = getPointerPos(e);
            window.gameState.dragCurrentX = pos.x;
            window.gameState.dragCurrentY = pos.y;
            updateGolferAngle(pos.x, pos.y);
        }

        function handleEnd(e) {
            if (!window.gameState.isDragging) return;
            window.gameState.isDragging = false;

            const pullDx = window.gameState.dragStartX - window.gameState.dragCurrentX;
            const pullDy = window.gameState.dragStartY - window.gameState.dragCurrentY;
            const dist = Math.sqrt(pullDx*pullDx + pullDy*pullDy);
            
            if (dist > 10) { 
                const scale = Math.min(dist, 200) / 10;
                const angle = Math.atan2(pullDy, pullDx);
                window.gameState.ball.vx = Math.cos(angle) * scale;
                window.gameState.ball.vy = Math.sin(angle) * scale;
                window.gameState.ball.moving = true;
                window.gameState.strokes++;
                updateUI();
            }
        }
        
        function updateGolferAngle(targetX, targetY) {
            const dx = window.gameState.ball.x - targetX;
            const dy = window.gameState.ball.y - targetY;
            window.gameState.golferAngle = Math.atan2(dy, dx);
        }

        window.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('touchstart', handleStart, {passive: false});
        window.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, {passive: false});
        window.addEventListener('touchend', handleEnd);

        // --- Physics & Camera ---

        function update() {
            // Update Camera
            const targetCamX = window.gameState.ball.x - width / 2;
            const targetCamY = window.gameState.ball.y - height / 2;
            
            // Smooth follow
            window.gameState.camera.x += (targetCamX - window.gameState.camera.x) * 0.1;
            window.gameState.camera.y += (targetCamY - window.gameState.camera.y) * 0.1;
            
            // Clamp camera to world bounds
            window.gameState.camera.x = Math.max(0, Math.min(window.gameState.camera.x, window.gameState.worldWidth - width));
            window.gameState.camera.y = Math.max(0, Math.min(window.gameState.camera.y, window.gameState.worldHeight - height));

            if (!window.gameState.ball.moving) return;

            window.gameState.ball.x += window.gameState.ball.vx;
            window.gameState.ball.y += window.gameState.ball.vy;

            let currentFriction = FRICTION;
            
            // Sand
            for (let sand of window.gameState.sand) {
                if (rectCircleColliding(sand, window.gameState.ball)) {
                    currentFriction = 0.85; 
                }
            }

            window.gameState.ball.vx *= currentFriction;
            window.gameState.ball.vy *= currentFriction;

            // Stop condition
            if (Math.abs(window.gameState.ball.vx) < STOP_THRESHOLD && Math.abs(window.gameState.ball.vy) < STOP_THRESHOLD) {
                window.gameState.ball.vx = 0; window.gameState.ball.vy = 0; window.gameState.ball.moving = false;
            }

            // Walls
            for (let wall of window.gameState.walls) resolveWallCollision(wall);

            // Water
            for (let water of window.gameState.water) {
                if (rectCircleColliding(water, window.gameState.ball)) {
                    window.gameState.strokes++;
                    showMessage("SPLASH! +1 Stroke");
                    window.gameState.ball.moving = false;
                    setTimeout(() => {
                        // Reset to start
                        const levelData = window.activeCourse.levels[window.gameState.levelIndex];
                        window.gameState.ball.x = levelData.start.x * window.gameState.worldWidth;
                        window.gameState.ball.y = levelData.start.y * window.gameState.worldHeight;
                        window.gameState.ball.vx = 0;
                        window.gameState.ball.vy = 0;
                        window.gameState.camera.x = window.gameState.ball.x - width/2;
                        window.gameState.camera.y = window.gameState.ball.y - height/2;
                        updateUI();
                        hideMessage();
                    }, 1000);
                    return; 
                }
            }

            // Hole
            const dx = window.gameState.ball.x - window.gameState.hole.x;
            const dy = window.gameState.ball.y - window.gameState.hole.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < window.gameState.hole.radius) {
                const speed = Math.sqrt(window.gameState.ball.vx*window.gameState.ball.vx + window.gameState.ball.vy*window.gameState.ball.vy);
                if (speed < 12) {
                    window.gameState.ball.inHole = true;
                    window.gameState.ball.moving = false;
                    window.gameState.ball.x = window.gameState.hole.x;
                    window.gameState.ball.y = window.gameState.hole.y;
                    levelComplete();
                }
            }
        }

        function rectCircleColliding(rect, circle) {
            const distX = Math.abs(circle.x - rect.x - rect.w / 2);
            const distY = Math.abs(circle.y - rect.y - rect.h / 2);
            if (distX > (rect.w / 2 + circle.radius)) return false;
            if (distY > (rect.h / 2 + circle.radius)) return false;
            if (distX <= (rect.w / 2)) return true; 
            if (distY <= (rect.h / 2)) return true;
            const dx = distX - rect.w / 2;
            const dy = distY - rect.h / 2;
            return (dx * dx + dy * dy <= (circle.radius * circle.radius));
        }

        function resolveWallCollision(wall) {
            if (window.gameState.ball.x + window.gameState.ball.radius > wall.x &&
                window.gameState.ball.x - window.gameState.ball.radius < wall.x + wall.w &&
                window.gameState.ball.y + window.gameState.ball.radius > wall.y &&
                window.gameState.ball.y - window.gameState.ball.radius < wall.y + wall.h) {
                
                const closestX = Math.max(wall.x, Math.min(window.gameState.ball.x, wall.x + wall.w));
                const closestY = Math.max(wall.y, Math.min(window.gameState.ball.y, wall.y + wall.h));
                const dx = window.gameState.ball.x - closestX;
                const dy = window.gameState.ball.y - closestY;

                if (Math.abs(dx) > Math.abs(dy)) {
                    window.gameState.ball.vx *= -WALL_BOUNCE;
                    if (dx > 0) window.gameState.ball.x = wall.x + wall.w + window.gameState.ball.radius;
                    else window.gameState.ball.x = wall.x - window.gameState.ball.radius;
                } else {
                    window.gameState.ball.vy *= -WALL_BOUNCE;
                    if (dy > 0) window.gameState.ball.y = wall.y + wall.h + window.gameState.ball.radius;
                    else window.gameState.ball.y = wall.y - window.gameState.ball.radius;
                }
            }
        }

        function levelComplete() {
            let msg = "Level Complete!";
            if (window.gameState.strokes === 1) msg = "HOLE IN ONE!";
            else if (window.gameState.strokes <= window.gameState.par) msg = "Under Par!";
            showMessage(msg);
            setTimeout(() => {
                hideMessage();
                loadLevel(window.gameState.levelIndex + 1);
            }, 2000);
        }

        function showMessage(text) {
            messageText.innerText = text;
            messageArea.classList.add('visible');
        }

        function hideMessage() {
            messageArea.classList.remove('visible');
        }

        function updateUI() {
            uiStrokes.innerText = window.gameState.strokes;
            uiLevel.innerText = window.gameState.levelIndex + 1;
            uiPar.innerText = window.gameState.par;
        }

        // --- Rendering ---

        function drawMenuBackground() {
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 0, width, height);
            ctx.strokeStyle = '#34495e';
            ctx.lineWidth = 2;
            const time = Date.now() * 0.001;
            for(let i=0; i<width; i+=50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i + Math.sin(time + i)*20, height);
                ctx.stroke();
            }
        }

        function draw() {
            if (!window.gameState.isPlaying) {
                drawMenuBackground();
                return;
            }

            // Save context and apply Camera Translate
            ctx.save();
            ctx.translate(-window.gameState.camera.x, -window.gameState.camera.y);

            // Grass (Draw world size)
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(0, 0, window.gameState.worldWidth, window.gameState.worldHeight);

            // Grid
            ctx.strokeStyle = 'rgba(0,0,0,0.05)';
            ctx.lineWidth = 1;
            for(let x=0; x<window.gameState.worldWidth; x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,window.gameState.worldHeight); ctx.stroke(); }
            for(let y=0; y<window.gameState.worldHeight; y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(window.gameState.worldWidth,y); ctx.stroke(); }

            // Obstacles
            ctx.fillStyle = '#f1c40f';
            for (let sand of window.gameState.sand) {
                ctx.fillRect(sand.x, sand.y, sand.w, sand.h);
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                for(let i=0; i<5; i++) {
                     ctx.beginPath(); ctx.arc(sand.x + Math.random()*sand.w, sand.y + Math.random()*sand.h, 2, 0, Math.PI*2); ctx.fill();
                }
                ctx.fillStyle = '#f1c40f';
            }

            ctx.fillStyle = '#3498db';
            for (let water of window.gameState.water) ctx.fillRect(water.x, water.y, water.w, water.h);

            ctx.fillStyle = '#7f8c8d';
            for (let wall of window.gameState.walls) {
                ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(wall.x, wall.y, wall.w, 5);
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(wall.x, wall.y + wall.h - 5, wall.w, 5);
                ctx.fillStyle = '#7f8c8d';
            }

            // Hole
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath(); ctx.arc(window.gameState.hole.x, window.gameState.hole.y, window.gameState.hole.radius, 0, Math.PI * 2); ctx.fill();

            // Ball
            if (!window.gameState.ball.inHole) {
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath(); ctx.arc(window.gameState.ball.x + 2, window.gameState.ball.y + 2, window.gameState.ball.radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = window.gameState.ball.color;
                ctx.beginPath(); ctx.arc(window.gameState.ball.x, window.gameState.ball.y, window.gameState.ball.radius, 0, Math.PI * 2); ctx.fill();
            }

            // Golfer
            if (!window.gameState.ball.moving && !window.gameState.ball.inHole) drawGolfer();

            // Aim Line
            if (window.gameState.isDragging && !window.gameState.ball.moving) {
                let dx = window.gameState.ball.x - window.gameState.dragCurrentX;
                let dy = window.gameState.ball.y - window.gameState.dragCurrentY;
                let dist = Math.sqrt(dx*dx + dy*dy);
                let angle = Math.atan2(dy, dx);
                let power = Math.min(dist, 200);

                ctx.save();
                ctx.translate(window.gameState.ball.x, window.gameState.ball.y);
                ctx.rotate(angle);
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(power, 0); ctx.stroke();
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.moveTo(power, 0); ctx.lineTo(power - 10, -5); ctx.lineTo(power - 10, 5); ctx.fill();
                ctx.restore();
            }

            // Restore context (End World Draw)
            ctx.restore();

            // UI Overlays (Screen Space)
            drawOffscreenIndicator();
        }

        function drawOffscreenIndicator() {
            // Check if hole is visible
            const holeScreenX = window.gameState.hole.x - window.gameState.camera.x;
            const holeScreenY = window.gameState.hole.y - window.gameState.camera.y;

            const margin = 30;
            const isOffscreen = 
                holeScreenX < -margin || 
                holeScreenX > width + margin || 
                holeScreenY < -margin || 
                holeScreenY > height + margin;

            if (isOffscreen) {
                const dx = holeScreenX - (width / 2);
                const dy = holeScreenY - (height / 2);
                const angle = Math.atan2(dy, dx);
                
                // Position arrow at edge of screen
                const cx = width / 2;
                const cy = height / 2;
                const r = Math.min(width, height) / 2 - 40;
                
                const arrowX = cx + Math.cos(angle) * r;
                const arrowY = cy + Math.sin(angle) * r;

                ctx.save();
                ctx.translate(arrowX, arrowY);
                ctx.rotate(angle);

                // Draw Arrow
                ctx.fillStyle = '#f1c40f';
                ctx.shadowColor = 'black';
                ctx.shadowBlur = 5;
                ctx.beginPath();
                ctx.moveTo(15, 0);
                ctx.lineTo(-10, -10);
                ctx.lineTo(-10, 10);
                ctx.fill();
                
                // Text
                ctx.rotate(-angle); // Reset rotation for text
                ctx.fillStyle = 'white';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText("HOLE", 0, 25);

                ctx.restore();
            }
        }

        function drawGolfer() {
            const offsetDist = 25;
            const gx = window.gameState.ball.x - Math.cos(window.gameState.golferAngle) * offsetDist;
            const gy = window.gameState.ball.y - Math.sin(window.gameState.golferAngle) * offsetDist;

            ctx.save();
            ctx.translate(gx, gy);
            ctx.rotate(window.gameState.golferAngle);

            ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.ellipse(0, 0, 10, 18, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#95a5a6'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(5, 5); ctx.lineTo(offsetDist - 5, 0); ctx.stroke();
            ctx.strokeStyle = '#34495e'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(offsetDist - 5, -5); ctx.lineTo(offsetDist - 5, 5); ctx.stroke();
            ctx.restore();
        }

        function gameLoop() {
            if (window.gameState.isPlaying) update();
            draw();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // Init
        resize();
        gameLoop(); 

    </script>
</body>
