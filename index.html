<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Mini Golf</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Prevent browser zooming/scrolling */
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            color: white;
            text-shadow: 2px 2px 0 #000;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            color: #f1c40f;
        }

        p {
            margin: 5px 0 0 0;
            font-size: 16px;
        }

        #message-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #message-area.visible {
            opacity: 1;
        }

        .message-text {
            font-size: 48px;
            font-weight: bold;
            color: #fff;
            text-shadow: 3px 3px 0 #27ae60;
            background: rgba(0,0,0,0.5);
            padding: 20px 40px;
            border-radius: 10px;
        }

        #controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1>Retro Mini Golf</h1>
        <p>Par: <span id="par-display">3</span></p>
        <p>Strokes: <span id="strokes-display">0</span></p>
        <p>Level: <span id="level-display">1</span></p>
    </div>

    <div id="message-area">
        <div id="message-text" class="message-text">Hole in One!</div>
    </div>

    <div id="controls-hint">Drag anywhere to aim and shoot</div>

    <canvas id="gameCanvas"></canvas>

    <script>
        /**
         * Game Configuration and State
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiStrokes = document.getElementById('strokes-display');
        const uiLevel = document.getElementById('level-display');
        const uiPar = document.getElementById('par-display');
        const messageArea = document.getElementById('message-area');
        const messageText = document.getElementById('message-text');

        let width, height;
        
        // Physics constants
        const FRICTION = 0.97;
        const STOP_THRESHOLD = 0.1;
        const MAX_POWER = 15;
        const WALL_BOUNCE = 0.7;

        // Game State
        let gameState = {
            level: 1,
            strokes: 0,
            par: 3,
            isDragging: false,
            dragStartX: 0,
            dragStartY: 0,
            dragCurrentX: 0,
            dragCurrentY: 0,
            ball: {
                x: 0, y: 0, vx: 0, vy: 0, radius: 8, color: '#ecf0f1', moving: false, inHole: false
            },
            hole: {
                x: 0, y: 0, radius: 12
            },
            walls: [], // Array of rects {x, y, w, h}
            water: [], // Array of rects
            sand: [],  // Array of rects
            golferAngle: 0
        };

        /**
         * Initialization and Resizing
         */
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            // If the ball is off-screen (e.g. after a resize), reset it to center
            if (gameState.ball.x < 0 || gameState.ball.x > width || gameState.ball.y < 0 || gameState.ball.y > height) {
                resetLevel(gameState.level);
            }
        }

        window.addEventListener('resize', resize);

        function initGame() {
            resize();
            resetLevel(1);
            requestAnimationFrame(gameLoop);
        }

        /**
         * Level Generation
         */
        function resetLevel(level) {
            gameState.level = level;
            gameState.strokes = 0;
            gameState.ball.moving = false;
            gameState.ball.vx = 0;
            gameState.ball.vy = 0;
            gameState.ball.inHole = false;
            gameState.isDragging = false;
            
            updateUI();

            // Responsive Level Layout
            const padding = Math.min(width, height) * 0.1;
            const playableWidth = width - padding * 2;
            const playableHeight = height - padding * 2;

            // Clear previous obstacles
            gameState.walls = [];
            gameState.water = [];
            gameState.sand = [];

            // Standard border walls
            gameState.walls.push({x: 0, y: 0, w: width, h: 20}); // Top
            gameState.walls.push({x: 0, y: height - 20, w: width, h: 20}); // Bottom
            gameState.walls.push({x: 0, y: 0, w: 20, h: height}); // Left
            gameState.walls.push({x: width - 20, y: 0, w: 20, h: height}); // Right

            // Set Start and Hole positions based on level
            if (level === 1) {
                // Straight shot
                gameState.par = 2;
                gameState.ball.x = width * 0.2;
                gameState.ball.y = height * 0.5;
                gameState.hole.x = width * 0.8;
                gameState.hole.y = height * 0.5;

                // Simple obstacle
                gameState.sand.push({
                    x: width * 0.4, 
                    y: height * 0.3, 
                    w: width * 0.2, 
                    h: height * 0.4
                });

            } else if (level === 2) {
                // Dogleg
                gameState.par = 3;
                gameState.ball.x = width * 0.15;
                gameState.ball.y = height * 0.8;
                gameState.hole.x = width * 0.85;
                gameState.hole.y = height * 0.2;

                // Walls to force a corner
                gameState.walls.push({
                    x: width * 0.4,
                    y: height * 0.4,
                    w: width * 0.6,
                    h: 20
                });

                gameState.water.push({
                    x: width * 0.6,
                    y: height * 0.6,
                    w: 80,
                    h: 80
                });
            } else if (level === 3) {
                // Narrow pass
                gameState.par = 4;
                gameState.ball.x = width * 0.5;
                gameState.ball.y = height * 0.9;
                gameState.hole.x = width * 0.5;
                gameState.hole.y = height * 0.1;

                // Center block
                gameState.walls.push({
                    x: width * 0.3,
                    y: height * 0.4,
                    w: width * 0.4,
                    h: 40
                });
                
                // Side water
                gameState.water.push({x: 0, y: height * 0.4, w: width * 0.2, h: 40});
                gameState.water.push({x: width * 0.8, y: height * 0.4, w: width * 0.2, h: 40});

            } else {
                // Loop back to level 1 for now (infinite loop)
                resetLevel(1);
            }
            updateUI();
        }

        /**
         * Input Handling
         */
        function getPointerPos(e) {
            if (e.touches) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function handleStart(e) {
            if (gameState.ball.moving || gameState.ball.inHole) return;
            
            const pos = getPointerPos(e);
            gameState.isDragging = true;
            gameState.dragStartX = gameState.ball.x; // Drag relative to ball
            gameState.dragStartY = gameState.ball.y;
            gameState.dragCurrentX = pos.x;
            gameState.dragCurrentY = pos.y;
            
            // Initial angle calculation for golfer rotation
            updateGolferAngle(pos.x, pos.y);
        }

        function handleMove(e) {
            if (!gameState.isDragging) return;
            const pos = getPointerPos(e);
            gameState.dragCurrentX = pos.x;
            gameState.dragCurrentY = pos.y;
            
            updateGolferAngle(pos.x, pos.y);
        }

        function handleEnd(e) {
            if (!gameState.isDragging) return;
            gameState.isDragging = false;

            // Calculate vector from touch point to ball (pull back to shoot)
            // Logic: Dragging away from ball creates a vector towards the ball
            // Actually standard angry-birds style: Drag back -> Shoot forward
            
            // Calculate vector from mouse to ball
            let dx = gameState.ball.x - gameState.dragCurrentX;
            let dy = gameState.ball.y - gameState.dragCurrentY;

            // If we drag from arbitrary screen point, we need the delta
            // Let's simplify: Input vector is simply (Start - Current)
            // But we set StartX to BallX for simplicity in handleStart. 
            // However, touch drag feels better if start is where you touch.
            
            // Let's use simple distance based on drag start vs drag end, applied to ball direction
            // But visually, we are drawing a line from ball.
            // Let's assume the user touched the ball (or near it) and dragged back.
            
            // Re-calc based on visual "pull string" logic
            // Vector is (Ball Position - Mouse Position)
            // If mouse is to the left of ball, vector is positive X (shoot right)
            
            // We need to support dragging anywhere on screen though for mobile friendliness
            // So:
            // Vector = (dragStartX - dragCurrentX, dragStartY - dragCurrentY)
            // But centered on the ball
            
            // Actually, let's just stick to: Vector = Ball - Mouse (Assuming mouse acts as the pull point)
            // For "Drag Anywhere":
            // We need the delta from the start of the drag.
            
            // Vector magnitude
            const pullDx = gameState.dragStartX - gameState.dragCurrentX; // Dragging left (negative) produces positive force (right)
            const pullDy = gameState.dragStartY - gameState.dragCurrentY;
            
            // Apply power limit
            const dist = Math.sqrt(pullDx*pullDx + pullDy*pullDy);
            
            if (dist > 10) { // Minimum threshold to shoot
                const scale = Math.min(dist, 200) / 10; // Cap power
                
                const angle = Math.atan2(pullDy, pullDx);
                
                gameState.ball.vx = Math.cos(angle) * scale;
                gameState.ball.vy = Math.sin(angle) * scale;
                gameState.ball.moving = true;
                gameState.strokes++;
                updateUI();
                
                // Play swing sound (optional, kept silent for template)
            }
        }
        
        function updateGolferAngle(targetX, targetY) {
            // Golfer faces the direction we are aiming
            // If dragging, we aim opposite to the drag
            const dx = gameState.ball.x - targetX;
            const dy = gameState.ball.y - targetY;
            gameState.golferAngle = Math.atan2(dy, dx);
        }

        window.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
        
        window.addEventListener('touchstart', handleStart, {passive: false});
        window.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, {passive: false});
        window.addEventListener('touchend', handleEnd);

        /**
         * Physics Engine
         */
        function update() {
            if (!gameState.ball.moving) return;

            // Apply Velocity
            gameState.ball.x += gameState.ball.vx;
            gameState.ball.y += gameState.ball.vy;

            // Apply Friction
            let currentFriction = FRICTION;

            // Check Sand Traps
            let inSand = false;
            for (let sand of gameState.sand) {
                if (rectCircleColliding(sand, gameState.ball)) {
                    currentFriction = 0.85; // Heavy friction
                    inSand = true;
                }
            }

            gameState.ball.vx *= currentFriction;
            gameState.ball.vy *= currentFriction;

            // Stop if too slow
            if (Math.abs(gameState.ball.vx) < STOP_THRESHOLD && Math.abs(gameState.ball.vy) < STOP_THRESHOLD) {
                gameState.ball.vx = 0;
                gameState.ball.vy = 0;
                gameState.ball.moving = false;
            }

            // Wall Collisions
            for (let wall of gameState.walls) {
                resolveWallCollision(wall);
            }

            // Water Hazards
            for (let water of gameState.water) {
                if (rectCircleColliding(water, gameState.ball)) {
                    // Reset ball to start of level (penalty)
                    gameState.strokes++;
                    showMessage("SPLASH! +1 Stroke");
                    gameState.ball.moving = false;
                    setTimeout(() => {
                        // Reset to rough start area
                        if (gameState.level === 1) {
                            gameState.ball.x = width * 0.2; gameState.ball.y = height * 0.5;
                        } else if (gameState.level === 2) {
                            gameState.ball.x = width * 0.15; gameState.ball.y = height * 0.8;
                        } else {
                            gameState.ball.x = width * 0.5; gameState.ball.y = height * 0.9;
                        }
                        gameState.ball.vx = 0;
                        gameState.ball.vy = 0;
                        updateUI();
                    }, 1000);
                    return; 
                }
            }

            // Hole Collision
            const dx = gameState.ball.x - gameState.hole.x;
            const dy = gameState.ball.y - gameState.hole.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < gameState.hole.radius) {
                // Determine success based on speed
                const speed = Math.sqrt(gameState.ball.vx*gameState.ball.vx + gameState.ball.vy*gameState.ball.vy);
                if (speed < 10) { // Can't go in if too fast
                    gameState.ball.inHole = true;
                    gameState.ball.moving = false;
                    gameState.ball.x = gameState.hole.x;
                    gameState.ball.y = gameState.hole.y;
                    levelComplete();
                }
            }
        }

        function rectCircleColliding(rect, circle) {
            const distX = Math.abs(circle.x - rect.x - rect.w / 2);
            const distY = Math.abs(circle.y - rect.y - rect.h / 2);

            if (distX > (rect.w / 2 + circle.radius)) { return false; }
            if (distY > (rect.h / 2 + circle.radius)) { return false; }

            if (distX <= (rect.w / 2)) { return true; } 
            if (distY <= (rect.h / 2)) { return true; }

            const dx = distX - rect.w / 2;
            const dy = distY - rect.h / 2;
            return (dx * dx + dy * dy <= (circle.radius * circle.radius));
        }

        function resolveWallCollision(wall) {
            // Simple AABB collision response (imperfect for corners but good for walls)
            // Check if inside expanded bounding box
            if (gameState.ball.x + gameState.ball.radius > wall.x &&
                gameState.ball.x - gameState.ball.radius < wall.x + wall.w &&
                gameState.ball.y + gameState.ball.radius > wall.y &&
                gameState.ball.y - gameState.ball.radius < wall.y + wall.h) {
                
                // Determine side of collision
                // Find closest point on rect to circle center
                const closestX = Math.max(wall.x, Math.min(gameState.ball.x, wall.x + wall.w));
                const closestY = Math.max(wall.y, Math.min(gameState.ball.y, wall.y + wall.h));

                const dx = gameState.ball.x - closestX;
                const dy = gameState.ball.y - closestY;

                if (Math.abs(dx) > Math.abs(dy)) {
                    // Hit vertical side
                    gameState.ball.vx *= -WALL_BOUNCE;
                    // Push out
                    if (dx > 0) gameState.ball.x = wall.x + wall.w + gameState.ball.radius;
                    else gameState.ball.x = wall.x - gameState.ball.radius;
                } else {
                    // Hit horizontal side
                    gameState.ball.vy *= -WALL_BOUNCE;
                    // Push out
                    if (dy > 0) gameState.ball.y = wall.y + wall.h + gameState.ball.radius;
                    else gameState.ball.y = wall.y - gameState.ball.radius;
                }
            }
        }

        function levelComplete() {
            let msg = "Level Complete!";
            if (gameState.strokes === 1) msg = "HOLE IN ONE!";
            else if (gameState.strokes <= gameState.par) msg = "Under Par!";
            
            showMessage(msg);
            
            setTimeout(() => {
                resetLevel(gameState.level + 1);
                hideMessage();
            }, 2000);
        }

        function showMessage(text) {
            messageText.innerText = text;
            messageArea.classList.add('visible');
        }

        function hideMessage() {
            messageArea.classList.remove('visible');
        }

        function updateUI() {
            uiStrokes.innerText = gameState.strokes;
            uiLevel.innerText = gameState.level;
            uiPar.innerText = gameState.par;
        }

        /**
         * Rendering
         */
        function draw() {
            // Background (Grass)
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(0, 0, width, height);

            // Draw Pattern (Grid)
            ctx.strokeStyle = 'rgba(0,0,0,0.05)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for(let x=0; x<width; x+=gridSize) {
                ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,height); ctx.stroke();
            }
            for(let y=0; y<height; y+=gridSize) {
                ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(width,y); ctx.stroke();
            }

            // Draw Sand
            ctx.fillStyle = '#f1c40f';
            for (let sand of gameState.sand) {
                ctx.fillRect(sand.x, sand.y, sand.w, sand.h);
                // Texture
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                for(let i=0; i<10; i++) {
                     ctx.beginPath();
                     ctx.arc(sand.x + Math.random()*sand.w, sand.y + Math.random()*sand.h, 2, 0, Math.PI*2);
                     ctx.fill();
                }
                ctx.fillStyle = '#f1c40f'; // Reset
            }

            // Draw Water
            ctx.fillStyle = '#3498db';
            for (let water of gameState.water) {
                ctx.fillRect(water.x, water.y, water.w, water.h);
            }

            // Draw Walls
            ctx.fillStyle = '#7f8c8d';
            for (let wall of gameState.walls) {
                ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                // 3D effect bevel
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(wall.x, wall.y, wall.w, 5); // Top highlight
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(wall.x, wall.y + wall.h - 5, wall.w, 5); // Bottom shadow
                ctx.fillStyle = '#7f8c8d'; // Reset
            }

            // Draw Hole
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath();
            ctx.arc(gameState.hole.x, gameState.hole.y, gameState.hole.radius, 0, Math.PI * 2);
            ctx.fill();

            // Draw Ball
            if (!gameState.ball.inHole) {
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.arc(gameState.ball.x + 2, gameState.ball.y + 2, gameState.ball.radius, 0, Math.PI * 2);
                ctx.fill();

                // Ball
                ctx.fillStyle = gameState.ball.color;
                ctx.beginPath();
                ctx.arc(gameState.ball.x, gameState.ball.y, gameState.ball.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw Golfer (Only when idle)
            if (!gameState.ball.moving && !gameState.ball.inHole) {
                drawGolfer();
            }

            // Draw Aim Line
            if (gameState.isDragging && !gameState.ball.moving) {
                // We draw the line from the ball, opposite to the mouse
                // Vector Mouse -> Ball
                let dx = gameState.ball.x - gameState.dragCurrentX;
                let dy = gameState.ball.y - gameState.dragCurrentY;
                
                // Same logic as shoot force
                let dist = Math.sqrt(dx*dx + dy*dy);
                let angle = Math.atan2(dy, dx);
                let power = Math.min(dist, 200);

                ctx.save();
                ctx.translate(gameState.ball.x, gameState.ball.y);
                ctx.rotate(angle);

                // Dotted line
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(10, 0); // Start slightly away from ball
                ctx.lineTo(power, 0);
                ctx.stroke();

                // Arrow head
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.moveTo(power, 0);
                ctx.lineTo(power - 10, -5);
                ctx.lineTo(power - 10, 5);
                ctx.fill();

                ctx.restore();
            }
        }

        function drawGolfer() {
            // A simple top-down golfer
            // Positioned near the ball, rotated by golferAngle
            
            const offsetDist = 25;
            const gx = gameState.ball.x - Math.cos(gameState.golferAngle) * offsetDist;
            const gy = gameState.ball.y - Math.sin(gameState.golferAngle) * offsetDist;

            ctx.save();
            ctx.translate(gx, gy);
            ctx.rotate(gameState.golferAngle);

            // Shoulders
            ctx.fillStyle = '#e74c3c'; // Red shirt
            ctx.beginPath();
            ctx.ellipse(0, 0, 10, 18, 0, 0, Math.PI * 2);
            ctx.fill();

            // Head
            ctx.fillStyle = '#f1c40f'; // Yellow hat/hair
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI * 2);
            ctx.fill();

            // Putter (Line pointing to ball)
            ctx.strokeStyle = '#95a5a6'; // Metal
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(5, 5); // Right hand area
            ctx.lineTo(offsetDist - 5, 0); // Towards ball
            ctx.stroke();
            
            // Putter head
            ctx.strokeStyle = '#34495e';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(offsetDist - 5, -5);
            ctx.lineTo(offsetDist - 5, 5);
            ctx.stroke();

            ctx.restore();
        }

        /**
         * Game Loop
         */
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start
        initGame();

    </script>
</body>
</html>
