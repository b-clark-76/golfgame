<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Golf Sim</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            user-select: none;
        }

        canvas { display: block; }

        /* Main Game Canvas */
        #gameCanvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        /* Minimap Canvas */
        #minimapCanvas {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #fff;
            border-radius: 8px;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* UI Overlay Layer */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            color: white;
            text-shadow: 2px 2px 0 #000;
            z-index: 10;
            display: none;
        }

        h1 { margin: 0; font-size: 24px; color: #f1c40f; }
        p { margin: 5px 0 0 0; font-size: 16px; }

        /* Club Selector */
        #club-selector {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 20; /* Higher than canvas */
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 12px;
            display: none; 
            pointer-events: auto; /* Ensure clicks register */
        }

        .club-btn {
            width: 60px;
            height: 70px;
            background: #34495e;
            border: 2px solid #7f8c8d;
            border-radius: 8px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
        }

        .club-btn.active {
            background: #27ae60;
            border-color: #f1c40f;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        
        .club-btn.disabled {
            opacity: 0.5;
            pointer-events: none;
            background: #2c3e50;
        }

        .club-icon { font-size: 20px; margin-bottom: 5px; }
        .club-name { font-weight: bold; }
        .club-dist { font-size: 10px; opacity: 0.8; }

        /* Start Menu */
        #start-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
        }

        #start-menu h1 { font-size: 48px; margin-bottom: 40px; text-shadow: 4px 4px 0 #27ae60; }

        .menu-btn {
            background: #27ae60;
            border: none;
            padding: 15px 40px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 4px 0 #219150;
        }
        .menu-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #219150; }
        .menu-btn:hover { background: #2ecc71; }

        .file-upload-container {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }
        .file-input { margin-top: 10px; color: #ecf0f1; }
        #error-msg { color: #e74c3c; margin-top: 10px; min-height: 20px; font-weight: bold; }

        /* Scorecard Modal */
        #scorecard-modal {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #ecf0f1;
            color: #2c3e50;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
            display: none;
            z-index: 200;
            min-width: 300px;
        }
        #scorecard-modal h2 { color: #27ae60; font-size: 32px; margin: 0 0 20px 0; }
        .score-big { font-size: 64px; font-weight: bold; color: #2c3e50; margin: 10px 0; }
        .score-detail { font-size: 18px; margin-bottom: 20px; color: #7f8c8d; }

        /* Notifications */
        #message-area {
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 50;
        }
        #message-area.visible { opacity: 1; }
        .message-text {
            font-size: 48px;
            font-weight: bold;
            color: #fff;
            text-shadow: 3px 3px 0 #27ae60;
            background: rgba(0,0,0,0.5);
            padding: 20px 40px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Start Menu -->
    <div id="start-menu">
        <h1>Retro Golf Sim</h1>
        <button class="menu-btn" onclick="startGame(null)">Play Default Course</button>
        <div class="file-upload-container">
            <p>Or upload Custom Course (.json)</p>
            <input type="file" id="course-upload" class="file-input" accept=".json">
            <div id="error-msg"></div>
        </div>
    </div>

    <!-- Scorecard -->
    <div id="scorecard-modal">
        <h2>Round Complete!</h2>
        <div class="score-detail">You shot a</div>
        <div class="score-big" id="final-score">72</div>
        <div class="score-detail" id="final-course-name">at Default Course</div>
        <button class="menu-btn" onclick="location.reload()">Return to Club House</button>
    </div>

    <!-- HUD -->
    <div id="ui-layer">
        <h1 id="course-title">Default Course</h1>
        <p>Hole: <span id="level-display">1</span> / <span id="total-levels">18</span></p>
        <p>Par: <span id="par-display">3</span></p>
        <p>Strokes: <span id="strokes-display">0</span></p>
        <p style="margin-top: 10px; font-size: 14px; color: #bdc3c7;">Current Lie: <span id="lie-display" style="color: #fff; font-weight: bold;">Tee Box</span></p>
    </div>

    <!-- Club Selector -->
    <div id="club-selector">
        <!-- Generated by JS -->
    </div>

    <!-- Notifications -->
    <div id="message-area">
        <div id="message-text" class="message-text">Nice Shot!</div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <canvas id="minimapCanvas" width="200" height="150"></canvas>

    <script>
        /**
         * DEFAULT COURSE DATA
         */
        const defaultCourseData = {
            id: "default_links_v2",
            name: "Pine Valley Links",
            levels: [
                {
                    par: 3,
                    scale: 1.5,
                    start: {x: 0.1, y: 0.5},
                    hole: {x: 0.9, y: 0.5},
                    fairways: [{x: 0.1, y: 0.4, w: 0.7, h: 0.2}],
                    greens: [{x: 0.85, y: 0.4, w: 0.1, h: 0.2}],
                    walls: [],
                    sand: [{x: 0.7, y: 0.3, w: 0.1, h: 0.1}],
                    water: []
                },
                {
                    par: 4,
                    scale: 2.0,
                    start: {x: 0.1, y: 0.9},
                    hole: {x: 0.9, y: 0.1},
                    fairways: [
                        {x: 0.1, y: 0.8, w: 0.2, h: 0.15}, 
                        {x: 0.3, y: 0.4, w: 0.5, h: 0.4},
                        {x: 0.8, y: 0.1, w: 0.15, h: 0.2}
                    ],
                    greens: [{x: 0.88, y: 0.08, w: 0.08, h: 0.12}],
                    walls: [],
                    sand: [{x: 0.5, y: 0.5, w: 0.1, h: 0.1}],
                    water: [{x: 0.3, y: 0.7, w: 0.2, h: 0.2}]
                },
                 {
                    par: 5,
                    scale: 3.0,
                    start: {x: 0.05, y: 0.5},
                    hole: {x: 0.95, y: 0.5},
                    fairways: [
                        {x: 0.05, y: 0.45, w: 0.3, h: 0.1},
                        {x: 0.4, y: 0.3, w: 0.2, h: 0.4},
                        {x: 0.7, y: 0.45, w: 0.2, h: 0.1}
                    ],
                    greens: [{x: 0.92, y: 0.45, w: 0.06, h: 0.1}],
                    walls: [],
                    sand: [{x: 0.35, y: 0.4, w: 0.05, h: 0.2}],
                    water: [{x: 0.6, y: 0.2, w: 0.1, h: 0.6}]
                }
            ]
        };

        // Clubs Configuration
        // MaxDist is roughly pixels of travel at full power
        const CLUBS = [
            { name: "Driver", icon: "🏌️", maxDist: 400, minDist: 150, flight: true, color: "#e74c3c" },
            { name: "Iron", icon: "🏸", maxDist: 250, minDist: 50, flight: true, color: "#e67e22" },
            { name: "Wedge", icon: "⚒️", maxDist: 120, minDist: 10, flight: true, color: "#f1c40f" },
            { name: "Putter", icon: "⛳", maxDist: 60, minDist: 0, flight: false, color: "#2ecc71" }
        ];

        /**
         * Game Engine
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimapCanvas');
        const mmCtx = minimapCanvas.getContext('2d');
        
        // UI Elements
        const startMenu = document.getElementById('start-menu');
        const uiLayer = document.getElementById('ui-layer');
        const clubSelector = document.getElementById('club-selector');
        const scorecardModal = document.getElementById('scorecard-modal');
        const uiStrokes = document.getElementById('strokes-display');
        const uiLevel = document.getElementById('level-display');
        const uiTotalLevels = document.getElementById('total-levels');
        const uiPar = document.getElementById('par-display');
        const uiLie = document.getElementById('lie-display');
        const uiTitle = document.getElementById('course-title');
        const messageArea = document.getElementById('message-area');
        const messageText = document.getElementById('message-text');
        const errorMsg = document.getElementById('error-msg');

        let width, height;
        let animationFrameId;
        
        // Physics constants
        const FRICTION_FAIRWAY = 0.96;
        const FRICTION_ROUGH = 0.85;
        const FRICTION_GREEN = 0.98;
        const FRICTION_SAND = 0.70;
        const GRAVITY = 0.5;

        // Game State
        window.activeCourse = null;
        window.gameState = {
            isPlaying: false,
            levelIndex: 0, 
            strokes: 0,
            par: 3,
            selectedClubIdx: 0,
            isPutting: false,
            
            // World/Camera
            levelScale: 1.0,
            worldWidth: 0,
            worldHeight: 0,
            camera: { x: 0, y: 0, zoom: 1.0, targetZoom: 1.0 },

            isDragging: false,
            dragStartX: 0, dragStartY: 0, 
            dragCurrentX: 0, dragCurrentY: 0, 
            
            ball: { 
                x: 0, y: 0, z: 0, 
                vx: 0, vy: 0, vz: 0, 
                radius: 6, color: '#ecf0f1', 
                state: 'idle' // idle, flying, rolling
            },
            hole: { x: 0, y: 0, radius: 10 },
            
            // Terrain
            walls: [], water: [], sand: [], fairways: [], greens: [],
            
            golferAngle: 0
        };

        // --- Initialization ---

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            
            if (!window.gameState.isPlaying) {
                drawMenuBackground();
            }
        }
        window.addEventListener('resize', resize);

        // --- File Upload Logic ---

        document.getElementById('course-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const json = JSON.parse(e.target.result);
                    if (validateCourse(json)) startGame(json);
                    else throw new Error("Invalid course format");
                } catch (err) { errorMsg.innerText = "Error: " + err.message; }
            };
            reader.readAsText(file);
        });

        function validateCourse(data) {
            return (data.levels && Array.isArray(data.levels) && data.levels.length > 0 && data.levels[0].start && data.levels[0].hole);
        }

        // --- Game Flow Control ---

        window.startGame = function(customCourseData) {
            window.activeCourse = customCourseData || defaultCourseData;
            
            startMenu.style.display = 'none';
            uiLayer.style.display = 'block';
            clubSelector.style.display = 'flex';
            scorecardModal.style.display = 'none';
            
            uiTitle.innerText = window.activeCourse.name || "Custom Course";
            uiTotalLevels.innerText = window.activeCourse.levels.length;

            window.gameState.isPlaying = true;
            generateClubUI();
            resize(); 
            loadLevel(0);
            
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function loadLevel(index) {
            if (index >= window.activeCourse.levels.length) {
                endGame();
                return;
            }

            window.gameState.levelIndex = index;
            const levelData = window.activeCourse.levels[index];
            
            window.gameState.par = levelData.par || 3;
            window.gameState.ball.state = 'idle';
            window.gameState.ball.vx = 0;
            window.gameState.ball.vy = 0;
            window.gameState.ball.vz = 0;
            window.gameState.ball.z = 0;
            window.gameState.isDragging = false;
            
            // Fix: Force putting mode off immediately
            window.gameState.isPutting = false;
            
            // Scale Setup
            window.gameState.levelScale = levelData.scale || 1.0;
            window.gameState.worldWidth = width * window.gameState.levelScale;
            window.gameState.worldHeight = height * window.gameState.levelScale;
            
            // Reset Camera Instantly
            window.gameState.camera.targetZoom = 1.0;
            window.gameState.camera.zoom = 1.0;
            
            updateUI();
            selectClub(0); // Default to driver

            // Coordinate conversion
            const sx = (val) => val * window.gameState.worldWidth;
            const sy = (val) => val * window.gameState.worldHeight;

            // Setup Objects
            window.gameState.ball.x = sx(levelData.start.x);
            window.gameState.ball.y = sy(levelData.start.y);
            window.gameState.hole.x = sx(levelData.hole.x);
            window.gameState.hole.y = sy(levelData.hole.y);
            
            // Center camera
            centerCameraOnBall();

            // Clear & Load Terrain
            window.gameState.walls = [];
            window.gameState.water = [];
            window.gameState.sand = [];
            window.gameState.fairways = [];
            window.gameState.greens = [];

            // Borders
            window.gameState.walls.push({x: 0, y: 0, w: window.gameState.worldWidth, h: 20}); 
            window.gameState.walls.push({x: 0, y: window.gameState.worldHeight - 20, w: window.gameState.worldWidth, h: 20});
            window.gameState.walls.push({x: 0, y: 0, w: 20, h: window.gameState.worldHeight});
            window.gameState.walls.push({x: window.gameState.worldWidth - 20, y: 0, w: 20, h: window.gameState.worldHeight});

            // Load Custom
            const loadRects = (src, dest) => { if(src) src.forEach(r => dest.push({x: sx(r.x), y: sy(r.y), w: sx(r.w), h: sy(r.h)})); };
            
            loadRects(levelData.fairways, window.gameState.fairways);
            loadRects(levelData.greens, window.gameState.greens);
            loadRects(levelData.walls, window.gameState.walls);
            loadRects(levelData.water, window.gameState.water);
            loadRects(levelData.sand, window.gameState.sand);

            determineLie(); // Check initial position
        }

        function endGame() {
            window.gameState.isPlaying = false;
            clubSelector.style.display = 'none';
            scorecardModal.style.display = 'block';
            document.getElementById('final-score').innerText = window.gameState.strokes;
            document.getElementById('final-course-name').innerText = "at " + window.activeCourse.name;
        }

        // --- Club Logic ---

        function generateClubUI() {
            clubSelector.innerHTML = '';
            CLUBS.forEach((club, index) => {
                const btn = document.createElement('div');
                btn.className = 'club-btn';
                btn.id = 'club-btn-' + index;
                btn.innerHTML = `
                    <div class="club-icon">${club.icon}</div>
                    <div class="club-name">${club.name}</div>
                    <div class="club-dist">${club.minDist}-${club.maxDist}y</div>
                `;
                // Prevent click propagation to canvas
                btn.onmousedown = (e) => e.stopPropagation();
                btn.ontouchstart = (e) => e.stopPropagation();
                btn.onclick = (e) => {
                    e.stopPropagation();
                    selectClub(index);
                };
                clubSelector.appendChild(btn);
            });
            // Highlight default
            selectClub(window.gameState.selectedClubIdx);
        }

        function selectClub(index) {
            // Cannot change club while ball moving
            if (window.gameState.ball.state !== 'idle') return;
            
            // If putting, forced to putter
            if (window.gameState.isPutting && index !== 3) return;

            window.gameState.selectedClubIdx = index;
            
            // UI Update
            document.querySelectorAll('.club-btn').forEach((b, i) => {
                b.classList.toggle('active', i === index);
                b.classList.toggle('disabled', window.gameState.isPutting && i !== 3);
            });
        }

        // --- Inputs ---

        function getPointerPos(e) {
            let cx, cy;
            if (e.touches) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; } 
            else { cx = e.clientX; cy = e.clientY; }
            
            const zoom = window.gameState.camera.zoom;
            return { 
                x: (cx - width/2) / zoom + window.gameState.camera.x, 
                y: (cy - height/2) / zoom + window.gameState.camera.y 
            };
        }

        function handleStart(e) {
            // Only interact if touching canvas
            if (e.target.id !== 'gameCanvas') return;
            
            if (!window.gameState.isPlaying || window.gameState.ball.state !== 'idle') return;
            const pos = getPointerPos(e);
            
            window.gameState.isDragging = true;
            window.gameState.dragStartX = window.gameState.ball.x; 
            window.gameState.dragStartY = window.gameState.ball.y;
            window.gameState.dragCurrentX = pos.x;
            window.gameState.dragCurrentY = pos.y;
            
            updateGolferAngle(pos.x, pos.y);
        }

        function handleMove(e) {
            if (!window.gameState.isDragging) return;
            const pos = getPointerPos(e);
            window.gameState.dragCurrentX = pos.x;
            window.gameState.dragCurrentY = pos.y;
            updateGolferAngle(pos.x, pos.y);
        }

        function handleEnd(e) {
            if (!window.gameState.isDragging) return;
            window.gameState.isDragging = false;

            const pullDx = window.gameState.dragStartX - window.gameState.dragCurrentX;
            const pullDy = window.gameState.dragStartY - window.gameState.dragCurrentY;
            let dist = Math.sqrt(pullDx*pullDx + pullDy*pullDy);
            
            const club = CLUBS[window.gameState.selectedClubIdx];
            
            // Club Min/Max enforcement
            if (dist < 10) return;

            // Scale drag: 200px drag = 100% power
            let powerRatio = Math.min(dist, 200) / 200; 
            
            // Physics Speed Calculation
            // Scale arbitrary units. 
            // Max club dist -> Speed unit. 
            // 20.0 speed ~= 400 yards visual distance approximately
            const maxSpeed = club.maxDist / 20; 
            let speed = maxSpeed * powerRatio;

            // Enforce Min Power
            const minSpeed = club.minDist / 20;
            if (speed < minSpeed) speed = minSpeed;

            let angle = Math.atan2(pullDy, pullDx);
            
            // Add Uncertainty (Mishit logic)
            // +/- 5 degrees deviation
            // Reduced for Putter to +/- 1 degree to keep it playable
            const uncertaintyRange = window.gameState.isPutting ? 1 : 5;
            const deviation = (Math.random() - 0.5) * 2 * (uncertaintyRange * Math.PI / 180);
            angle += deviation;

            // Set Velocity
            window.gameState.ball.vx = Math.cos(angle) * speed;
            window.gameState.ball.vy = Math.sin(angle) * speed;
            
            // Z-Axis Launch
            if (club.flight) {
                window.gameState.ball.state = 'flying';
                window.gameState.ball.vz = speed * 0.5; // Launch angle/height
            } else {
                window.gameState.ball.state = 'rolling';
                window.gameState.ball.vz = 0;
            }

            window.gameState.strokes++;
            updateUI();
        }
        
        function updateGolferAngle(targetX, targetY) {
            const dx = window.gameState.ball.x - targetX;
            const dy = window.gameState.ball.y - targetY;
            window.gameState.golferAngle = Math.atan2(dy, dx);
        }

        window.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('touchstart', handleStart, {passive: false});
        window.addEventListener('touchmove', (e) => { 
            // Prevent default only if dragging on canvas to allow scrolling elsewhere if needed
            if(e.target.id === 'gameCanvas') e.preventDefault(); 
            handleMove(e); 
        }, {passive: false});
        window.addEventListener('touchend', handleEnd);

        // --- Physics & Camera ---

        function update() {
            // Camera Zoom Lerp
            const cam = window.gameState.camera;
            cam.zoom += (cam.targetZoom - cam.zoom) * 0.05;

            // Camera Position Follow
            const targetCamX = window.gameState.ball.x;
            const targetCamY = window.gameState.ball.y;
            
            cam.x += (targetCamX - cam.x) * 0.1;
            cam.y += (targetCamY - cam.y) * 0.1;

            const ball = window.gameState.ball;
            if (ball.state === 'idle') return;

            // 1. Move XY
            ball.x += ball.vx;
            ball.y += ball.vy;

            // 2. Flight Physics
            if (ball.state === 'flying') {
                ball.z += ball.vz;
                ball.vz -= GRAVITY;

                // Land?
                if (ball.z <= 0) {
                    ball.z = 0;
                    // Bounce?
                    if (Math.abs(ball.vz) > 2) {
                        ball.vz *= -0.4; 
                        ball.vx *= 0.6; 
                        ball.vy *= 0.6;
                    } else {
                        ball.state = 'rolling';
                        ball.vz = 0;
                        checkHazardsOnLand(); 
                    }
                }
            } 
            
            // 3. Rolling Physics
            if (ball.state === 'rolling') {
                // Determine Friction
                let friction = FRICTION_ROUGH; 
                for(let f of window.gameState.fairways) if(rectCircleColliding(f, ball)) friction = FRICTION_FAIRWAY;
                for(let g of window.gameState.greens) if(rectCircleColliding(g, ball)) friction = FRICTION_GREEN;
                for(let s of window.gameState.sand) if(rectCircleColliding(s, ball)) friction = FRICTION_SAND;
                for(let w of window.gameState.water) {
                    if(rectCircleColliding(w, ball)) {
                        handleWaterHazard();
                        return;
                    }
                }

                ball.vx *= friction;
                ball.vy *= friction;

                // Stop?
                if (Math.abs(ball.vx) < 0.05 && Math.abs(ball.vy) < 0.05) {
                    ball.vx = 0; ball.vy = 0;
                    ball.state = 'idle';
                    determineLie();
                }

                // Hole Check
                const dx = ball.x - window.gameState.hole.x;
                const dy = ball.y - window.gameState.hole.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < window.gameState.hole.radius) {
                    const speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
                    if (speed < 5) {
                        ball.state = 'inHole';
                        ball.x = window.gameState.hole.x;
                        ball.y = window.gameState.hole.y;
                        levelComplete();
                    }
                }
            }

            // Wall Collisions
            for (let wall of window.gameState.walls) resolveWallCollision(wall);
        }

        function checkHazardsOnLand() {
            for(let w of window.gameState.water) {
                if(rectCircleColliding(w, window.gameState.ball)) {
                    handleWaterHazard();
                }
            }
        }

        function handleWaterHazard() {
            window.gameState.strokes++;
            showMessage("SPLASH! +1 Stroke");
            window.gameState.ball.state = 'idle';
            const levelData = window.activeCourse.levels[window.gameState.levelIndex];
            window.gameState.ball.x = levelData.start.x * window.gameState.worldWidth;
            window.gameState.ball.y = levelData.start.y * window.gameState.worldHeight;
            window.gameState.ball.vx = 0; window.gameState.ball.vy = 0; window.gameState.ball.z = 0;
            centerCameraOnBall();
            updateUI();
        }

        function determineLie() {
            const ball = window.gameState.ball;
            let lie = "Rough";
            let onGreen = false;

            for(let f of window.gameState.fairways) if(rectCircleColliding(f, ball)) lie = "Fairway";
            for(let s of window.gameState.sand) if(rectCircleColliding(s, ball)) lie = "Bunker";
            for(let g of window.gameState.greens) {
                if(rectCircleColliding(g, ball)) {
                    lie = "Green";
                    onGreen = true;
                }
            }

            const levelData = window.activeCourse.levels[window.gameState.levelIndex];
            const startX = levelData.start.x * window.gameState.worldWidth;
            const startY = levelData.start.y * window.gameState.worldHeight;
            const dist = Math.sqrt(Math.pow(ball.x - startX, 2) + Math.pow(ball.y - startY, 2));
            if(dist < 50 && window.gameState.strokes === 0) lie = "Tee Box";

            uiLie.innerText = lie;
            
            // Putting Mode Logic
            if (onGreen) {
                window.gameState.isPutting = true;
                window.gameState.camera.targetZoom = 2.5; // Zoom in
                selectClub(3); // Auto select putter
            } else {
                window.gameState.isPutting = false;
                window.gameState.camera.targetZoom = 1.0;
                
                // Auto Select club based on distance
                const distToHole = Math.sqrt(Math.pow(window.gameState.hole.x - ball.x, 2) + Math.pow(window.gameState.hole.y - ball.y, 2));
                if (distToHole > 4000) selectClub(0); // Driver
                else if (distToHole > 2000) selectClub(1); // Iron
                else selectClub(2); // Wedge
            }
            generateClubUI();
        }

        function rectCircleColliding(rect, circle) {
            const distX = Math.abs(circle.x - rect.x - rect.w / 2);
            const distY = Math.abs(circle.y - rect.y - rect.h / 2);
            if (distX > (rect.w / 2 + circle.radius)) return false;
            if (distY > (rect.h / 2 + circle.radius)) return false;
            if (distX <= (rect.w / 2)) return true; 
            if (distY <= (rect.h / 2)) return true;
            const dx = distX - rect.w / 2;
            const dy = distY - rect.h / 2;
            return (dx * dx + dy * dy <= (circle.radius * circle.radius));
        }

        function resolveWallCollision(wall) {
            const b = window.gameState.ball;
            if (b.x + b.radius > wall.x && b.x - b.radius < wall.x + wall.w &&
                b.y + b.radius > wall.y && b.y - b.radius < wall.y + wall.h) {
                
                const closestX = Math.max(wall.x, Math.min(b.x, wall.x + wall.w));
                const closestY = Math.max(wall.y, Math.min(b.y, wall.y + wall.h));
                const dx = b.x - closestX;
                const dy = b.y - closestY;

                if (Math.abs(dx) > Math.abs(dy)) {
                    b.vx *= -0.7;
                    if (dx > 0) b.x = wall.x + wall.w + b.radius;
                    else b.x = wall.x - b.radius;
                } else {
                    b.vy *= -0.7;
                    if (dy > 0) b.y = wall.y + wall.h + b.radius;
                    else b.y = wall.y - b.radius;
                }
            }
        }

        function centerCameraOnBall() {
            window.gameState.camera.x = window.gameState.ball.x;
            window.gameState.camera.y = window.gameState.ball.y;
        }

        function levelComplete() {
            let msg = "Birdie!";
            const s = window.gameState.strokes;
            const p = window.gameState.par;
            if (s === 1) msg = "HOLE IN ONE!";
            else if (s < p) msg = "Birdie!";
            else if (s === p) msg = "Par";
            else if (s === p + 1) msg = "Bogey";
            else msg = "Double Bogey";
            
            showMessage(msg);
            setTimeout(() => {
                hideMessage();
                loadLevel(window.gameState.levelIndex + 1);
            }, 2000);
        }

        function showMessage(text) { messageText.innerText = text; messageArea.classList.add('visible'); }
        function hideMessage() { messageArea.classList.remove('visible'); }
        function updateUI() {
            uiStrokes.innerText = window.gameState.strokes;
            uiLevel.innerText = window.gameState.levelIndex + 1;
            uiPar.innerText = window.gameState.par;
        }

        // --- Rendering ---

        function drawMenuBackground() {
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 0, width, height);
            ctx.strokeStyle = '#34495e';
            ctx.lineWidth = 2;
            const time = Date.now() * 0.001;
            for(let i=0; i<width; i+=50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i + Math.sin(time + i)*20, height);
                ctx.stroke();
            }
        }

        function draw() {
            if (!window.gameState.isPlaying) { drawMenuBackground(); return; }

            const cam = window.gameState.camera;
            
            // 1. Main Game View
            ctx.save();
            ctx.translate(width/2, height/2);
            ctx.scale(cam.zoom, cam.zoom);
            ctx.translate(-cam.x, -cam.y);

            // Rough
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(0, 0, window.gameState.worldWidth, window.gameState.worldHeight);

            // Terrain
            ctx.fillStyle = '#2ecc71';
            for (let f of window.gameState.fairways) ctx.fillRect(f.x, f.y, f.w, f.h);

            ctx.fillStyle = '#58d68d';
            for (let g of window.gameState.greens) {
                ctx.beginPath(); ctx.roundRect(g.x, g.y, g.w, g.h, 10); ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 2; ctx.stroke();
            }

            ctx.fillStyle = '#f1c40f';
            for (let s of window.gameState.sand) {
                ctx.beginPath(); ctx.roundRect(s.x, s.y, s.w, s.h, 5); ctx.fill();
            }

            ctx.fillStyle = '#3498db';
            for (let w of window.gameState.water) {
                ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillText("~", w.x + 10, w.y + 20);
                ctx.fillStyle = '#3498db';
            }

            ctx.fillStyle = '#95a5a6';
            for (let w of window.gameState.walls) ctx.fillRect(w.x, w.y, w.w, w.h);

            // Putting Scaler: If putting, draw items slightly smaller so they don't look giant when zoomed in
            const scaleMod = window.gameState.isPutting ? 0.6 : 1.0;

            // Hole
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath(); ctx.arc(window.gameState.hole.x, window.gameState.hole.y, window.gameState.hole.radius * scaleMod, 0, Math.PI * 2); ctx.fill();
            // Flag
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(window.gameState.hole.x - 1, window.gameState.hole.y - 30, 2, 30);
            ctx.beginPath(); ctx.moveTo(window.gameState.hole.x, window.gameState.hole.y - 30); ctx.lineTo(window.gameState.hole.x + 15, window.gameState.hole.y - 25); ctx.lineTo(window.gameState.hole.x, window.gameState.hole.y - 20); ctx.fill();

            // Ball Shadow
            if (window.gameState.ball.state !== 'inHole') {
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                const shadowSize = window.gameState.ball.radius * scaleMod * (1 - (window.gameState.ball.z / 200));
                ctx.beginPath(); ctx.arc(window.gameState.ball.x, window.gameState.ball.y, Math.max(0, shadowSize), 0, Math.PI * 2); ctx.fill();
            }

            // Ball
            if (window.gameState.ball.state !== 'inHole') {
                const b = window.gameState.ball;
                const scale = 1 + (b.z / 100); 
                ctx.fillStyle = b.color;
                ctx.beginPath(); 
                ctx.arc(b.x, b.y - b.z, b.radius * scaleMod * scale, 0, Math.PI * 2); 
                ctx.fill();
            }

            // Golfer
            if (window.gameState.ball.state === 'idle') drawGolfer(ctx, scaleMod);

            // Aim Line
            if (window.gameState.isDragging && window.gameState.ball.state === 'idle') {
                const club = CLUBS[window.gameState.selectedClubIdx];
                let dx = window.gameState.ball.x - window.gameState.dragCurrentX;
                let dy = window.gameState.ball.y - window.gameState.dragCurrentY;
                let dist = Math.sqrt(dx*dx + dy*dy);
                let angle = Math.atan2(dy, dx);
                
                let aimLen;

                if (window.gameState.isPutting) {
                    // Putting: Aim Line = Exact expected travel distance
                    // Distance = Velocity / (1 - Friction) roughly for frame based decay
                    // We calculate expected speed from drag
                    // Max Speed for Putter = 60/20 = 3
                    let powerRatio = Math.min(dist, 200) / 200;
                    let speed = (club.maxDist / 20) * powerRatio;
                    // Decay factor
                    let friction = FRICTION_GREEN; 
                    // Geometric sum approx: d = v / (1 - f)
                    aimLen = speed / (1 - friction);
                } else {
                    // Driving/Iron: Visual Scale based on power
                    let powerRatio = Math.min(dist, 200) / 200;
                    aimLen = 50 + (powerRatio * club.maxDist * 0.5); 
                }

                ctx.save();
                ctx.translate(window.gameState.ball.x, window.gameState.ball.y);
                ctx.rotate(angle);
                
                ctx.strokeStyle = club.color;
                ctx.lineWidth = 3 * scaleMod;
                ctx.setLineDash([5, 5]);
                
                ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(aimLen, 0); ctx.stroke();
                
                ctx.restore();
            }

            ctx.restore(); // End World View

            // 2. Minimap
            drawMinimap();
        }

        function drawGolfer(context, scale) {
            const offsetDist = 20 * scale;
            const gx = window.gameState.ball.x - Math.cos(window.gameState.golferAngle) * offsetDist;
            const gy = window.gameState.ball.y - Math.sin(window.gameState.golferAngle) * offsetDist;

            context.save();
            context.translate(gx, gy);
            context.rotate(window.gameState.golferAngle);
            context.scale(scale, scale);

            // Simple Top Down
            context.fillStyle = '#34495e'; 
            context.beginPath(); context.roundRect(-8, -5, 16, 10, 2); context.fill();
            context.fillStyle = '#e74c3c'; 
            context.beginPath(); context.arc(0, 0, 10, 0, Math.PI*2); context.fill();
            context.fillStyle = '#f1c40f'; 
            context.beginPath(); context.arc(0, 0, 6, 0, Math.PI*2); context.fill();
            
            context.strokeStyle = '#95a5a6'; context.lineWidth = 3;
            context.beginPath(); context.moveTo(5, 5); context.lineTo(15, 0); context.stroke();

            context.restore();
        }

        function drawMinimap() {
            const mmW = minimapCanvas.width;
            const mmH = minimapCanvas.height;
            const scaleX = mmW / window.gameState.worldWidth;
            const scaleY = mmH / window.gameState.worldHeight;
            const scale = Math.min(scaleX, scaleY);
            
            mmCtx.fillStyle = '#2c3e50';
            mmCtx.fillRect(0, 0, mmW, mmH);

            mmCtx.save();
            const offsetX = (mmW - window.gameState.worldWidth * scale) / 2;
            const offsetY = (mmH - window.gameState.worldHeight * scale) / 2;
            mmCtx.translate(offsetX, offsetY);
            mmCtx.scale(scale, scale);

            mmCtx.fillStyle = '#27ae60'; 
            mmCtx.fillRect(0,0, window.gameState.worldWidth, window.gameState.worldHeight);
            
            mmCtx.fillStyle = '#2ecc71'; 
            window.gameState.fairways.forEach(r => mmCtx.fillRect(r.x, r.y, r.w, r.h));
            
            mmCtx.fillStyle = '#58d68d'; 
            window.gameState.greens.forEach(r => mmCtx.fillRect(r.x, r.y, r.w, r.h));

            mmCtx.fillStyle = '#3498db'; 
            window.gameState.water.forEach(r => mmCtx.fillRect(r.x, r.y, r.w, r.h));
            
            mmCtx.fillStyle = '#f1c40f'; 
            window.gameState.sand.forEach(r => mmCtx.fillRect(r.x, r.y, r.w, r.h));

            mmCtx.fillStyle = '#fff';
            mmCtx.beginPath(); mmCtx.arc(window.gameState.hole.x, window.gameState.hole.y, 20, 0, Math.PI*2); mmCtx.fill();

            mmCtx.fillStyle = '#e74c3c';
            mmCtx.beginPath(); mmCtx.arc(window.gameState.ball.x, window.gameState.ball.y, 30, 0, Math.PI*2); mmCtx.fill();
            
            // Camera Box
            mmCtx.strokeStyle = 'rgba(255,255,255,0.5)';
            mmCtx.lineWidth = 10;
            const cam = window.gameState.camera;
            const vpW = width / cam.zoom;
            const vpH = height / cam.zoom;
            mmCtx.strokeRect(cam.x - vpW/2, cam.y - vpH/2, vpW, vpH);

            mmCtx.restore();
        }

        function gameLoop() {
            if (window.gameState.isPlaying) update();
            draw();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        resize();
        gameLoop();

    </script>
